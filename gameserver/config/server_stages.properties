# Server progression stages (4 steps). See ServerStagesManager in gameserver source.
# PK/PvP: growth of server-wide sums (characters.pkkills / pvpkills) since the start of the current stage.
# Raid: each raid boss kill by a player counts once.
# Average level: AVG(active base subclass level) of non-deleted characters.
# After all numeric goals are met: reward mail to everyone, next stage begins after the following restart.
# GM (Menu): //admin_stage_reset — сброс прогресса текущей стадии; //admin_stage_set <1-4> — смена стадии + сброс прогресса.

